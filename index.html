<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-From Care</title>
    
    <!-- Link Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Ikon Khusus iOS / Safari (iPhone) -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">

    <!-- Ikon Standar Browser & Android PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png">

    <!-- Pengaturan Warna Bar & Mode PWA -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff; 
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
        }
        
        /* Tombol PWA Cadangan di Layar Utama */
        #pwaInstallContainer {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 2px solid #3867f5;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 99999;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            width: 85%;
            max-width: 400px;
            justify-content: space-between;
        }
        .pwa-text-box h4 { margin: 0; font-size: 14px; color: #333; }
        .pwa-text-box p { margin: 2px 0 0 0; font-size: 11px; color: #666; }
        #btnPwaAction {
            background: #3867f5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Pop-up Tombol Install PWA Android -->
    <div id="pwaInstallContainer">
        <div class="pwa-text-box">
            <h4>Install E-From Care</h4>
            <p>Pasang di desktop layar utama HP Anda.</p>
        </div>
        <button id="btnPwaAction">Install</button>
    </div>

    <!-- IFRAME DENGAN LINK DEPLOYMENT GAS LATEST & PERMISSION LENGKAP -->
    <iframe 
        id="appIframe"
        src="https://script.google.com/a/macros/rabdurand.co.id/s/AKfycbyNAQLDChu5ZRikU3DU9pq3asoAyeHiL4Pveb_vMzIHFhYbOY2kflD1Ky09uxDESO8Afw/exec"
        allow="geolocation *; camera *; microphone *; autoplay *"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-storage-access-by-user-activation"
        allowfullscreen>
    </iframe>

    <!-- PWA Service Worker & Installation Prompt Script -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        const installContainer = document.getElementById('pwaInstallContainer');
        const installBtn = document.getElementById('btnPwaAction');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installContainer.style.display = 'flex';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User sukses menginstall aplikasi');
                    }
                    deferredPrompt = null;
                    installContainer.style.display = 'none';
                });
            }
        });
    </script>

    <!-- SDK Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      (function() {
        const firebaseConfig = {
          databaseURL: "https://eform-care-app-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        
        const database = firebase.database();
        const iframeEl = document.getElementById('appIframe');

        // 1. DENGARKAN DASHBOARD SUMMARY & TERUSKAN KE IFRAME
        database.ref('eform_data/dashboard_summary').on('value', (snapshot) => {
          const summaryData = snapshot.val();
          if (!summaryData) return;

          console.log("⚡ Realtime Summary Diterima di Parent PWA:", summaryData);

          if (iframeEl && iframeEl.contentWindow) {
            iframeEl.contentWindow.postMessage({
              type: 'FIREBASE_SUMMARY_UPDATE',
              data: summaryData
            }, '*');
          }
        });

        // 2. DENGARKAN REALTIME PENDING VISITS & TERUSKAN KE IFRAME (DISESUAIKAN NODE 'pending_visits')
        database.ref('pending_visits').on('value', (snapshot) => {
          const visitsData = snapshot.val();
          if (!visitsData) return;

          console.log("⚡ Realtime Pending Visits Diterima di Parent PWA:", visitsData);

          if (iframeEl && iframeEl.contentWindow) {
            iframeEl.contentWindow.postMessage({
              type: 'FIREBASE_VISITS_UPDATE',
              data: visitsData
            }, '*');
          }
        });

        // 3. DENGARKAN REALTIME REPORTS & TERUSKAN KE IFRAME (DISESUAIKAN NODE 'report_teknisi')
        database.ref('report_teknisi').on('value', (snapshot) => {
          const reportsData = snapshot.val();
          if (!reportsData) return;

          console.log("⚡ Realtime Reports Diterima di Parent PWA:", reportsData);

          if (iframeEl && iframeEl.contentWindow) {
            iframeEl.contentWindow.postMessage({
              type: 'FIREBASE_REPORTS_UPDATE',
              data: reportsData
            }, '*');
          }
        });

      })();
    </script>
</body>
</html>
